name: Deploy to Production Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint || echo "Linting skipped"
    
    - name: Run tests
      run: npm test || echo "Tests skipped"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build frontend
      run: npm run build
      env:
        VITE_API_URL: http://143.110.191.22:8000/api/v1
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          set -e
          echo "🚀 Starting deployment..."
          
          cd /var/www/Digital-Vehicle-Procurement
          
          echo "📥 Pulling latest code..."
          git pull origin main
          
          echo "🐍 Updating backend..."
          cd backend
          source venv/bin/activate
          pip install -r requirements.txt
          
          echo "⚛️ Updating frontend..."
          cd ..
          npm install
          npm run build
          
          echo "🔄 Restarting services..."
          pm2 restart tvs-backend
          pm2 restart tvs-frontend
          
          echo "✅ Deployment complete!"
          pm2 list
    
    - name: Verify deployment
      run: |
        sleep 10
        curl -f http://143.110.191.22:8000/health || exit 1
        echo "✅ Backend is healthy"
        
    - name: Notify on success
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "Frontend: http://143.110.191.22:3000"
        echo "Backend: http://143.110.191.22:8000"
        echo "API Docs: http://143.110.191.22:8000/docs"
