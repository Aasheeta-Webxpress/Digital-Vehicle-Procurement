services:
  frontend:
    image: ghcr.io/aasheeta-webxpress/digital-vehicle-procurement/frontend:latest
    container_name: tvs-frontend
    restart: unless-stopped
    ports:
      - "3020:80"
    depends_on:
      - backend
    networks:
      - tvs-network
    # ADDED: Resource limits to prevent OOM kills
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # ADDED: Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # ADDED: Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/aasheeta-webxpress/digital-vehicle-procurement/backend:latest
    container_name: tvs-backend
    restart: unless-stopped
    ports:
      - "8020:8000"
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
      - CORS_ORIGINS=http://143.110.191.22:3020,http://143.110.191.22
    networks:
      - tvs-network
    # ADDED: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # IMPROVED: Better health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8000/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # ADDED: Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tvs-network:
    driver: bridge
